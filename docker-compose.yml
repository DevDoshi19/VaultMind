# docker-compose.yml
# Place this at the project root — VaultMind/docker-compose.yml
#
# Commands:
#   docker compose up --build       → build images and start all containers
#   docker compose up               → start with existing images (no rebuild)
#   docker compose down             → stop and remove containers
#   docker compose logs -f          → stream logs from all services
#   docker compose logs -f backend  → logs from backend only

services:

  # -- Redis --
  redis:
    image: redis:7-alpine          # same image your other projects use
    container_name: vaultmind-redis

    # Redis default port. Backend reaches it at redis://redis:6379
    # "redis" is the service name — Docker DNS resolves it inside the network.
    ports:
      - "6380:6379"                # host 6380 to avoid conflict with other projects

    # Redis data persists across restarts via this volume.
    # Without it, cache is wiped every time the container restarts.
    volumes:
      - redis-data:/data

    # appendonly yes — writes every operation to disk for durability.
    # For a cache this is optional, but good practice.
    command: redis-server --appendonly yes

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

    restart: unless-stopped
    networks:
      - vaultmind-network


  # -- Backend --
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: vaultmind-backend

    env_file:
      - .env

    # REDIS_URL injected here — overrides anything in .env.
    # Backend reaches Redis by service name "redis" inside Docker network.
    environment:
      - REDIS_URL=redis://redis:6379

    ports:
      - "8000:8000"

    # Removed chroma_db volume — Pinecone is external, no local disk needed.
    # Only data/ remains for chunks.json (BM25 still needs raw text).
    volumes:
      - ./backend/data:/app/data

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

    # Wait for Redis to be healthy before starting backend.
    depends_on:
      redis:
        condition: service_healthy

    restart: unless-stopped
    networks:
      - vaultmind-network


  # -- Frontend --
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: vaultmind-frontend

    environment:
      - BACKEND_URL=http://backend:8000

    ports:
      - "8501:8501"

    depends_on:
      - backend

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

    restart: unless-stopped
    networks:
      - vaultmind-network


# -- Network --
networks:
  vaultmind-network:
    driver: bridge

# -- Volumes --
# Named volume for Redis persistence — managed by Docker, not a host folder.
volumes:
  redis-data: